[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
composeBom = "2026.09.00"
spotless = "8.10.4"
ktfmt = "0.65"
detekt = "1.23.8"
robolectric = "4.17"
media3 = "1.11.1"
room = "2.8.5"
datastore = "1.2.1"
work = "2.12.0"
navigationCompose = "2.10.2"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
appcompat = "1.8.0"
junit = "4.13.2"
coroutines = "1.10.2"
okhttp = "5.4.0"
espresso = "3.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
androidStubs = "4.1.1.4"
sherpaOnnx = "1.13.8"
# Not used yet; recorded so milestone 4 starts from the verified version.
onnxruntimeAndroid = "1.31.0"

[libraries]
# Build-logic (buildSrc) classpath
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-composeGradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
room-gradlePlugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-uiTooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-activityCompose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigationCompose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycleRuntimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycleViewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-coreKtx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }

# Concurrency
kotlinx-coroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Network
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

# Storage
androidx-datastorePreferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-work = { module = "androidx.work:work-runtime", version.ref = "work" }
androidx-roomRuntime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-roomKtx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-roomCompiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-roomTesting = { module = "androidx.room:room-testing", version.ref = "room" }

# Playback
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-datasourceOkhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }

# Tests
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-testExtJunit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-testRunner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
compose-uiTestJunit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-uiTestManifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-espressoCore = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# Only supplies android.content.res.AssetManager so the JVM tracker compiles against sherpa-onnx.
android-stubs = { module = "com.google.android:android", version.ref = "androidStubs" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
