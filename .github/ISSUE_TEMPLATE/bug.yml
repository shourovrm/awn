name: Bug
description: Something in the app does not work
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and device
      placeholder: "0.1.0, Pixel 6, Android 14"
    validations:
      required: true
