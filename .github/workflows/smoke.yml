name: Smoke test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fetch native libraries
        run: ./gradlew fetchNativeLibs

      - name: Create a throwaway signing key
        run: |
          key_password="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storetype PKCS12 \
            -alias ci -keyalg RSA -keysize 2048 -validity 2 \
            -storepass "$key_password" -keypass "$key_password" -dname "CN=Awn CI"
          echo "AWN_KEYSTORE_PATH=$RUNNER_TEMP/ci.jks" >> "$GITHUB_ENV"
          echo "AWN_KEYSTORE_PASSWORD=$key_password" >> "$GITHUB_ENV"
          echo "AWN_KEY_ALIAS=ci" >> "$GITHUB_ENV"
          echo "AWN_KEY_PASSWORD=$key_password" >> "$GITHUB_ENV"

      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          script: ./gradlew connectedGithubReleaseAndroidTest
