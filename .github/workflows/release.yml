name: Release

on:
  push:
    tags: ['v0.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Restore the signing key
        env:
          AWN_KEYSTORE_BASE64: ${{ secrets.AWN_KEYSTORE_BASE64 }}
        run: |
          echo "$AWN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/awn-release.jks"
          echo "AWN_KEYSTORE_PATH=$RUNNER_TEMP/awn-release.jks" >> "$GITHUB_ENV"

      - name: Build signed APKs, one per ABI
        env:
          AWN_KEYSTORE_PASSWORD: ${{ secrets.AWN_KEYSTORE_PASSWORD }}
          AWN_KEY_ALIAS: ${{ secrets.AWN_KEY_ALIAS }}
          AWN_KEY_PASSWORD: ${{ secrets.AWN_KEY_PASSWORD }}
        run: ./gradlew fetchNativeLibs assembleGithubRelease

      - name: Write checksums
        working-directory: app/build/outputs/apk/github/release
        run: sha256sum ./*.apk > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app/build/outputs/apk/github/release/*.apk

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/github/release/*.apk \
            app/build/outputs/apk/github/release/SHA256SUMS.txt \
            --prerelease --generate-notes
